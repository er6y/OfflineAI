plugins {
    id 'com.android.library'
}

android {
    namespace 'com.offlineai.mnn'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                // Enable MNN LLM with multiple backends
                arguments "-DMNN_BUILD_LLM=ON",
                          "-DMNN_BUILD_FOR_ANDROID_COMMAND=ON",
                          "-DMNN_OPENCL=ON",
                          "-DMNN_VULKAN=ON",
                          "-DMNN_NNAPI=ON",
                          "-DMNN_ARM82=ON",
                          "-DMNN_SUPPORT_TRANSFORMER_FUSE=ON",
                          "-DMNN_LOW_MEMORY=ON",
                          "-DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON",
                          "-DMNN_USE_LOGCAT=ON",
                          "-DMNN_OPEN_TIME_TRACE=ON",
                          "-DMNN_BUILD_OPENCV=ON",
                          "-DMNN_IMGCODECS=ON",
                          "-DMNN_BUILD_AUDIO=OFF",
                          "-DMNN_BUILD_DIFFUSION=ON",
                          "-DMNN_SEP_BUILD=OFF",
                          "-DMNN_KLEIDIAI=ON",
                          "-DMNN_BUILD_TOOLS=OFF"

                cppFlags "-std=c++17", "-fexceptions", "-frtti"
                // Build for both ARM64 (real device) and x86_64 (emulator)
                // NNAPI is conditionally enabled in CMakeLists.txt based on architecture
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }

        ndk {
            // Build for both ARM64 (real device) and x86_64 (emulator)
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libMNN.so'
        pickFirst 'lib/x86_64/libMNN.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

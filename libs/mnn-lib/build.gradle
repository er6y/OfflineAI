plugins {
    id 'com.android.library'
}

android {
    namespace 'com.offlineai.mnn.lib'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                // Build standalone libMNN.so with all engines and backends
                arguments "-DMNN_BUILD_LLM=ON",
                          "-DMNN_BUILD_FOR_ANDROID_COMMAND=ON",
                          "-DMNN_OPENCL=ON",
                          "-DMNN_VULKAN=ON",
                          "-DMNN_NNAPI=ON",
                          "-DMNN_ARM82=ON",
                          "-DMNN_SUPPORT_TRANSFORMER_FUSE=ON",
                          "-DMNN_LOW_MEMORY=ON",
                          "-DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON",
                          "-DMNN_USE_LOGCAT=ON",
                          "-DMNN_OPEN_TIME_TRACE=ON",
                          "-DMNN_BUILD_OPENCV=ON",
                          "-DMNN_IMGCODECS=ON",
                          "-DLLM_SUPPORT_VISION=ON",
                          "-DLLM_SUPPORT_AUDIO=ON",
                          "-DMNN_BUILD_AUDIO=ON",
                          "-DMNN_BUILD_DIFFUSION=ON",
                          // CRITICAL: MNN_SEP_BUILD=OFF merges all engines into libMNN.so
                          "-DMNN_SEP_BUILD=OFF",
                          "-DMNN_KLEIDIAI=ON",
                          "-DMNN_QNN=OFF",
                          "-DMNN_BUILD_TOOLS=OFF",
                          "-DMNN_WITH_PLUGIN=ON",
                          "-DBUILD_PLUGIN=ON",
                          "-DCMAKE_BUILD_TYPE=Release"

                cppFlags "-std=c++17", "-fexceptions", "-frtti"
                abiFilters 'arm64-v8a', 'x86_64'
                // CRITICAL: Only build MNN target (libMNN.so)
                targets "MNN"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'none'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            minifyEnabled false
            ndk {
                debugSymbolLevel 'none'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

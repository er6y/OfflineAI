//Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.0' apply false // Updated AGP version
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false // Upgrade Kotlin to support JDK 21
}

task clean(type: Delete) {
    delete rootProject.buildDir
    
    //  Rust 
    delete 'libs/tokenizers-jni/src/main/rust/target'
    
    //  
    delete 'app/build'
    delete 'libs/tokenizers-jni/build'
    delete 'libs/mnn-jni/build'
    
    doLast {
        println "  :"
        println "- Rust target   "
        println "-     build   "
    }
}